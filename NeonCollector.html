<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Collector</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons (Alternativa ligera y moderna a Lucide para HTML) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- PWA Manifest Link (Se generará dinámicamente, pero dejamos el tag preparado) -->
  <link id="manifest-link" rel="manifest" href="">

  <style>
    /* Configuraciones de Tailwind y CSS Personalizado */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050510;
      color: #e5e7eb;
      overflow-x: hidden;
    }

    /* Scrollbar Personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #050510; 
    }
    ::-webkit-scrollbar-thumb {
      background: #2dd4bf40; 
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2dd4bf80; 
    }

    /* Utilidades de animación y glassmorphism que Tailwind CDN maneja con clases, 
       pero agregamos algunas transiciones base */
    .glass-modal {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .item-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .item-card:hover .item-image {
      transform: scale(1.1);
    }
    
    .text-shadow-neon {
      text-shadow: 0 0 15px rgba(0,229,255,0.3);
    }
    
    /* Ocultar elementos */
    .hidden-force {
      display: none !important;
    }
  </style>
</head>
<body class="selection:bg-cyan-500/30">

  <!-- Background Decorativo Neon -->
  <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-600/20 blur-[120px] rounded-full mix-blend-screen"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-cyan-600/20 blur-[120px] rounded-full mix-blend-screen"></div>
  </div>

  <!-- Pantalla de Carga -->
  <div id="loader" class="fixed inset-0 z-50 bg-[#050510] flex items-center justify-center text-cyan-400 font-mono transition-opacity duration-500">
    <div class="animate-pulse flex flex-col items-center gap-4">
      <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin shadow-[0_0_20px_rgba(0,229,255,0.6)]"></div>
      Conectando...
    </div>
  </div>

  <!-- PANTALLA DE AUTENTICACIÓN -->
  <div id="auth-container" class="hidden-force fixed inset-0 z-40 bg-[#050510]/90 glass-modal flex flex-col items-center justify-center p-4 transition-opacity duration-500">
    <div class="w-full max-w-md bg-[#0f172a]/90 border border-white/20 shadow-[0_0_50px_rgba(168,85,247,0.15)] p-8 rounded-2xl relative overflow-hidden">
      <!-- Glow effect -->
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-purple-500/20 blur-[50px] rounded-full pointer-events-none"></div>
      <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-cyan-500/20 blur-[50px] rounded-full pointer-events-none"></div>
      
      <div class="relative z-10 text-center mb-8">
        <h2 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500 tracking-tight text-shadow-neon mb-2">NEON COLLECTOR</h2>
        <p class="text-gray-400 text-sm">Colección global. Progreso individual.</p>
      </div>

      <form id="auth-form" class="relative z-10 flex flex-col gap-4">
        <input id="auth-email" type="email" required placeholder="Correo electrónico" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all" />
        <input id="auth-pass" type="password" required placeholder="Contraseña (mínimo 6 caracteres)" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all" />
        <p id="auth-error" class="text-red-400 text-sm hidden"></p>
        
        <button type="submit" id="btn-login" class="mt-2 w-full bg-gradient-to-r from-cyan-600 to-cyan-400 hover:from-cyan-500 hover:to-cyan-300 text-black font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(0,229,255,0.4)] transition-all">Iniciar Sesión</button>
        <button type="button" id="btn-register" class="w-full bg-white/5 hover:bg-white/10 text-white font-bold py-3.5 rounded-xl border border-white/10 transition-all">Crear Nueva Cuenta</button>
      </form>
    </div>
  </div>

  <!-- Contenedor Principal -->
  <div class="relative z-10 p-4 md:p-8 max-w-7xl mx-auto min-h-screen flex flex-col hidden-force" id="app-container">
    
    <!-- ENCABEZADO GLOBAL -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 pb-6 border-b border-white/10 gap-4">
      <div class="flex flex-col">
        <h1 class="text-3xl md:text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500 tracking-tight text-shadow-neon">
          NEON COLLECTOR
        </h1>
        <p class="text-xs md:text-sm text-gray-400 mt-1 uppercase tracking-widest">Base de Datos Global</p>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Info Usuario -->
        <div id="user-info" class="hidden-force flex-col items-end text-sm">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider">Conectado</span>
          <span id="user-email" class="text-cyan-400 font-medium"></span>
        </div>
        <button id="logout-btn" onclick="window.logout()" class="hidden-force p-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl transition-all hover:shadow-[0_0_15px_rgba(239,68,68,0.3)]" title="Cerrar Sesión">
          <i class="ph ph-sign-out text-xl"></i>
        </button>

        <!-- Botón de Instalación PWA (Oculto por defecto) -->
        <button 
          id="install-btn"
          class="hidden-force items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-purple-600/80 to-cyan-500/80 hover:from-purple-500 hover:to-cyan-400 border border-white/20 rounded-xl text-white font-bold shadow-[0_0_15px_rgba(0,229,255,0.4)] hover:shadow-[0_0_25px_rgba(0,229,255,0.7)] transition-all animate-pulse"
        >
          <i class="ph ph-download-simple text-lg"></i>
          <span class="text-sm hidden sm:inline">Instalar</span>
        </button>
      </div>
    </header>

    <!-- Contenido Dinámico (Se inyecta por JS) -->
    <main id="main-content" class="flex-1 w-full"></main>

  </div>

  <!-- MODALES (Ocultos por defecto) -->
  
  <!-- Modal: Colección -->
  <div id="modal-collection" class="hidden-force fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 glass-modal transition-opacity">
    <div class="w-full max-w-md bg-[#0f172a]/80 border border-white/20 shadow-[0_0_40px_rgba(0,229,255,0.1)] p-6 rounded-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-collection-title" class="text-xl font-bold tracking-wide text-white">Crear Colección</h3>
        <button onclick="closeModal('modal-collection')" class="text-gray-400 hover:text-white transition-colors bg-white/5 p-1 rounded-full"><i class="ph ph-x text-xl"></i></button>
      </div>
      <form id="form-collection" class="flex flex-col gap-4">
        <input id="collection-name" type="text" required placeholder="Nombre (Ej. Latas de Monster)" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all placeholder-gray-600" />
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500"><i class="ph ph-image text-lg"></i></div>
          <input id="collection-url" type="url" placeholder="URL de la imagen de portada (Opcional)" class="w-full bg-black/60 border border-white/10 rounded-xl pl-10 pr-4 py-3.5 text-white focus:outline-none focus:border-cyan-400 transition-all placeholder-gray-600" />
        </div>
        <button id="btn-submit-collection" type="submit" class="mt-2 w-full bg-gradient-to-r from-cyan-600 to-cyan-400 hover:from-cyan-500 hover:to-cyan-300 text-black font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(0,229,255,0.4)] transition-all">Generar Colección</button>
      </form>
    </div>
  </div>

  <!-- Modal: Sección -->
  <div id="modal-section" class="hidden-force fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 glass-modal transition-opacity">
    <div class="w-full max-w-md bg-[#0f172a]/80 border border-white/20 shadow-[0_0_40px_rgba(0,229,255,0.1)] p-6 rounded-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold tracking-wide text-white">Crear Sección</h3>
        <button onclick="closeModal('modal-section')" class="text-gray-400 hover:text-white transition-colors bg-white/5 p-1 rounded-full"><i class="ph ph-x text-xl"></i></button>
      </div>
      <form id="form-section" class="flex flex-col gap-4">
        <input id="section-name" type="text" required placeholder="Nombre (Ej. Gama Ultra)" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all placeholder-gray-600" />
        <button type="submit" class="mt-2 w-full bg-gradient-to-r from-purple-600 to-purple-400 hover:from-purple-500 hover:to-purple-300 text-white font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all">Generar Sección</button>
      </form>
    </div>
  </div>

  <!-- Modal: Objeto -->
  <div id="modal-item" class="hidden-force fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 glass-modal transition-opacity">
    <div class="w-full max-w-md bg-[#0f172a]/80 border border-white/20 shadow-[0_0_40px_rgba(0,229,255,0.1)] p-6 rounded-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-item-title" class="text-xl font-bold tracking-wide text-white">Añadir Objeto</h3>
        <button onclick="closeModal('modal-item')" class="text-gray-400 hover:text-white transition-colors bg-white/5 p-1 rounded-full"><i class="ph ph-x text-xl"></i></button>
      </div>
      <form id="form-item" class="flex flex-col gap-4">
        <input id="item-name" type="text" required placeholder="Nombre del objeto" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 transition-all placeholder-gray-600" />
        <textarea id="item-desc" rows="2" placeholder="Descripción o notas (Opcional)" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 transition-all placeholder-gray-600 resize-none"></textarea>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500"><i class="ph ph-image text-lg"></i></div>
          <input id="item-url" type="url" placeholder="URL de la imagen (Opcional)" class="w-full bg-black/60 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-cyan-400 transition-all placeholder-gray-600" />
        </div>
        <button id="btn-submit-item" type="submit" class="mt-2 w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.3)] transition-all">Guardar Objeto</button>
      </form>
    </div>
  </div>

  <!-- Modal: Confirmar Borrado -->
  <div id="modal-delete" class="hidden-force fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 glass-modal transition-opacity">
    <div class="w-full max-w-md bg-[#0f172a]/90 border border-red-500/50 shadow-[0_0_40px_rgba(239,68,68,0.2)] p-6 rounded-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold tracking-wide text-red-400 flex items-center gap-2">
          <i class="ph ph-warning"></i> Confirmar Eliminación
        </h3>
        <button onclick="closeModal('modal-delete')" class="text-gray-400 hover:text-white transition-colors bg-white/5 p-1 rounded-full"><i class="ph ph-x text-xl"></i></button>
      </div>
      <div id="delete-message" class="text-gray-300 mb-6 text-sm"></div>
      <div class="flex gap-3">
        <button onclick="closeModal('modal-delete')" class="flex-1 bg-white/5 hover:bg-white/10 text-white font-medium py-3 rounded-xl transition-all border border-white/10">Cancelar</button>
        <button onclick="confirmDelete()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition-all shadow-[0_0_20px_rgba(239,68,68,0.4)]">Eliminar Definitivamente</button>
      </div>
    </div>
  </div>


  <!-- SCRIPTS DE LÓGICA Y FIREBASE -->
  <script type="module">
    // Importaciones de Firebase v11 (ES Modules para navegador estático)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Tu configuración exacta de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBw8-fCoMqoA-2sd-_WXF4J_CGwrV1SzQQ",
      authDomain: "neon-collector-15fe6.firebaseapp.com",
      projectId: "neon-collector-15fe6",
      storageBucket: "neon-collector-15fe6.firebasestorage.app",
      messagingSenderId: "763023143333",
      appId: "1:763023143333:web:b7afb3bd06da37075a384c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = firebaseConfig.projectId;

    // ESTADO GLOBAL DE LA APLICACIÓN
    window.appState = {
      user: null,
      collections: [],
      sections: [],
      items: [],
      ownedItems: new Set(), // Set de IDs de objetos que posee el usuario actual
      activeCollectionId: null,
      filterMode: 'all', // 'all', 'owned', 'missing'
      deleteTarget: null, // { type, id, name }
      editTarget: null, // { type, id }
      targetSectionId: null, // Para saber dónde añadir el item nuevo
      listeners: [] // Guardar desuscripciones
    };

    // Inicialización y Autenticación
    async function initApp() {
      // Listener de cambio de estado de Auth
      onAuthStateChanged(auth, (user) => {
        const loader = document.getElementById('loader');
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const userInfo = document.getElementById('user-info');
        const logoutBtn = document.getElementById('logout-btn');

        loader.classList.add('hidden-force');

        if (user) {
          // Sesión activa
          window.appState.user = user;
          authContainer.classList.add('hidden-force');
          appContainer.classList.remove('hidden-force');
          
          userInfo.classList.remove('hidden-force');
          userInfo.classList.add('flex');
          logoutBtn.classList.remove('hidden-force');
          document.getElementById('user-email').innerText = user.email || 'Anónimo';

          setupDatabaseListeners();
        } else {
          // No hay sesión
          window.appState.user = null;
          clearDatabaseListeners();
          
          authContainer.classList.remove('hidden-force');
          appContainer.classList.add('hidden-force');
          userInfo.classList.add('hidden-force');
          userInfo.classList.remove('flex');
          logoutBtn.classList.add('hidden-force');
        }
      });

      setupPWA();
    }

    // Configuración de Auth UI
    const authForm = document.getElementById('auth-form');
    const authEmail = document.getElementById('auth-email');
    const authPass = document.getElementById('auth-pass');
    const authError = document.getElementById('auth-error');
    const btnRegister = document.getElementById('btn-register');

    // Iniciar Sesión (Formulario)
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      try {
        document.getElementById('loader').classList.remove('hidden-force');
        await signInWithEmailAndPassword(auth, authEmail.value, authPass.value);
      } catch (err) {
        document.getElementById('loader').classList.add('hidden-force');
        authError.innerText = "Error: Verifica tu correo y contraseña.";
        authError.classList.remove('hidden');
      }
    });

    // Registrar nueva cuenta
    btnRegister.addEventListener('click', async () => {
      if(!authEmail.value || !authPass.value) {
        authError.innerText = "Por favor, introduce correo y contraseña.";
        authError.classList.remove('hidden');
        return;
      }
      authError.classList.add('hidden');
      try {
        document.getElementById('loader').classList.remove('hidden-force');
        await createUserWithEmailAndPassword(auth, authEmail.value, authPass.value);
      } catch (err) {
        document.getElementById('loader').classList.add('hidden-force');
        authError.innerText = "Error al crear cuenta. (La contraseña debe tener al menos 6 caracteres o el correo ya existe)";
        authError.classList.remove('hidden');
      }
    });

    // Cerrar sesión
    window.logout = async () => {
      await signOut(auth);
    };

    // Configuración de la PWA dinámica
    function setupPWA() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#050510" rx="100"/><circle cx="256" cy="256" r="200" fill="none" stroke="#00e5ff" stroke-width="40"/><circle cx="256" cy="256" r="120" fill="none" stroke="#a855f7" stroke-width="40"/></svg>`;
      const iconUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgIcon)}`;
      const manifest = {
        name: "Neon Collector",
        short_name: "Collector",
        description: "Tu colección de objetos en neón",
        start_url: ".",
        display: "standalone",
        theme_color: "#8b5cf6",
        background_color: "#050510",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('manifest-link').href = URL.createObjectURL(blob);

      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById('install-btn');
        installBtn.classList.remove('hidden-force');
        installBtn.classList.add('flex');
        
        installBtn.onclick = async () => {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.classList.add('hidden-force');
            installBtn.classList.remove('flex');
          }
          deferredPrompt = null;
        };
      });
    }

    function clearDatabaseListeners() {
      window.appState.listeners.forEach(unsub => unsub());
      window.appState.listeners = [];
      window.appState.collections = [];
      window.appState.sections = [];
      window.appState.items = [];
      window.appState.ownedItems.clear();
    }

    // Suscripciones a Firebase en Tiempo Real
    function setupDatabaseListeners() {
      clearDatabaseListeners();
      const uid = window.appState.user.uid;
      
      // Colecciones Públicas (Compartidas por todos)
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'collections');
      const secRef = collection(db, 'artifacts', appId, 'public', 'data', 'sections');
      const itmRef = collection(db, 'artifacts', appId, 'public', 'data', 'items');
      
      // Progreso Privado (Solo de este usuario)
      const ownedRef = collection(db, 'artifacts', appId, 'users', uid, 'owned_items');

      const u1 = onSnapshot(colRef, (snap) => {
        window.appState.collections = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderApp();
      }, (e) => console.error("Error cols:", e));

      const u2 = onSnapshot(secRef, (snap) => {
        window.appState.sections = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderApp();
      }, (e) => console.error("Error secs:", e));

      const u3 = onSnapshot(itmRef, (snap) => {
        window.appState.items = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderApp();
      }, (e) => console.error("Error items:", e));

      const u4 = onSnapshot(ownedRef, (snap) => {
        const owned = new Set();
        snap.docs.forEach(d => owned.add(d.id));
        window.appState.ownedItems = owned;
        renderApp();
      }, (e) => console.error("Error owned:", e));

      window.appState.listeners.push(u1, u2, u3, u4);
    }

    // Funciones de Escape HTML por seguridad
    function esc(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[match]));
    }

    // MOTOR DE RENDERIZADO PRINCIPAL
    function renderApp() {
      const mainContent = document.getElementById('main-content');
      if (!window.appState.activeCollectionId) {
        mainContent.innerHTML = generateCollectionsHTML();
      } else {
        mainContent.innerHTML = generateCollectionDetailHTML();
      }
    }

    // Generar Vista 1: Lista de Colecciones
    function generateCollectionsHTML() {
      const { collections, items, ownedItems } = window.appState;
      
      let html = `
        <div class="animate-in fade-in duration-500">
          <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl md:text-2xl font-semibold text-white flex items-center gap-2">
              <i class="ph-fill ph-folder-open text-cyan-400"></i> Colecciones Globales
            </h2>
            <button onclick="openModal('modal-collection')" class="bg-white/5 hover:bg-white/10 border border-white/10 hover:border-cyan-400/50 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all duration-300 hover:shadow-[0_0_15px_rgba(0,229,255,0.3)] text-sm md:text-base">
              <i class="ph ph-plus font-bold"></i> <span class="hidden sm:inline">Nueva Colección</span>
            </button>
          </div>
      `;

      if (collections.length === 0) {
        html += `
          <div class="text-center py-20 bg-white/5 border border-white/10 rounded-3xl backdrop-blur-sm shadow-[inset_0_0_50px_rgba(255,255,255,0.02)]">
            <i class="ph ph-folder-open text-6xl text-cyan-500/30 mb-4 inline-block"></i>
            <p class="text-gray-300 text-lg font-medium">Aún no hay colecciones en la base de datos.</p>
            <p class="text-sm text-gray-500 mt-2">Crea la primera para que todos puedan empezar su inventario.</p>
          </div>
        `;
      } else {
        html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">`;
        collections.forEach(col => {
          const colItems = items.filter(i => i.collectionId === col.id);
          // Calculamos el progreso usando el Set de ownedItems privado del usuario
          const ownedCount = colItems.filter(i => ownedItems.has(i.id)).length;
          const progress = colItems.length > 0 ? (ownedCount / colItems.length) * 100 : 0;
          
          const colBg = col.imageUrl ? `<div class="absolute inset-0 z-0"><img src="${esc(col.imageUrl)}" class="w-full h-full object-cover opacity-20 group-hover:opacity-40 transition-opacity duration-500" /></div>` : '';

          html += `
            <div onclick="openCollection('${col.id}')" class="group cursor-pointer bg-[#101018]/80 hover:bg-[#1a1a2e]/90 border border-white/5 hover:border-purple-400/50 rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(168,85,247,0.15)] relative overflow-hidden flex flex-col">
              ${colBg}
              <div class="absolute top-0 left-0 h-1.5 bg-gradient-to-r from-cyan-400 to-purple-500 transition-all duration-500 z-10" style="width: ${progress}%"></div>
              
              <div class="flex justify-between items-start mb-4 relative z-10">
                <h3 class="text-xl font-bold text-white group-hover:text-purple-300 transition-colors line-clamp-1 pr-2 drop-shadow-md">${esc(col.name)}</h3>
                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button onclick="event.stopPropagation(); promptEditCollection('${col.id}', '${encodeURIComponent(col.name)}', '${encodeURIComponent(col.imageUrl || '')}')" class="p-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 text-gray-400 hover:text-cyan-400 transition-colors border border-transparent hover:border-cyan-500/30">
                    <i class="ph ph-pencil-simple"></i>
                  </button>
                  <button onclick="event.stopPropagation(); promptDelete('collection', '${col.id}', '${encodeURIComponent(col.name)}')" class="p-1.5 rounded-lg bg-white/5 hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-colors border border-transparent hover:border-red-500/30">
                    <i class="ph ph-trash"></i>
                  </button>
                </div>
              </div>

              <div class="mt-auto flex justify-between items-end text-sm relative z-10">
                <span class="text-gray-400 bg-white/5 px-2 py-1 rounded-md">${colItems.length} Objetos Globales</span>
                <span class="text-cyan-400 font-mono font-bold tracking-wider">${Math.round(progress)}% Tienes</span>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      
      html += `</div>`;
      return html;
    }

    // Generar Vista 2: Detalle de Colección
    function generateCollectionDetailHTML() {
      const { collections, sections, items, ownedItems, activeCollectionId, filterMode } = window.appState;
      const activeCol = collections.find(c => c.id === activeCollectionId);
      if(!activeCol) { window.appState.activeCollectionId = null; return ''; }

      const colSections = sections.filter(s => s.collectionId === activeCollectionId);
      
      let filteredItems = items.filter(i => i.collectionId === activeCollectionId);
      if (filterMode === 'owned') filteredItems = filteredItems.filter(i => ownedItems.has(i.id));
      if (filterMode === 'missing') filteredItems = filteredItems.filter(i => !ownedItems.has(i.id));

      let html = `
        <div class="animate-in slide-in-from-right-8 duration-300">
          
          <!-- Header de la Colección -->
          <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-8 gap-6 bg-white/5 p-4 md:p-6 rounded-2xl border border-white/10 backdrop-blur-md">
            <div class="flex items-center gap-4">
              <button onclick="closeCollection()" class="p-2.5 bg-black/40 hover:bg-black/60 border border-white/10 rounded-xl text-cyan-400 transition-all hover:shadow-[0_0_15px_rgba(0,229,255,0.2)] flex items-center justify-center">
                <i class="ph ph-caret-left text-xl"></i>
              </button>
              <div>
                <h2 class="text-2xl md:text-3xl font-bold text-white">${esc(activeCol.name)}</h2>
                <p class="text-sm text-gray-400 mt-1">Base de Datos Global</p>
              </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto">
              <!-- Filtros (Aplican al progreso del usuario) -->
              <div class="flex bg-black/60 border border-white/10 rounded-xl p-1 backdrop-blur-md w-full sm:w-auto">
                <button onclick="setFilter('all')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-all ${filterMode === 'all' ? 'bg-gradient-to-r from-cyan-500/20 to-purple-500/20 border border-cyan-400/30 text-cyan-300 shadow-[0_0_15px_rgba(0,229,255,0.1)]' : 'text-gray-400 hover:text-gray-200 hover:bg-white/5 border border-transparent'}">Todos</button>
                <button onclick="setFilter('owned')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-all ${filterMode === 'owned' ? 'bg-gradient-to-r from-cyan-500/20 to-purple-500/20 border border-cyan-400/30 text-cyan-300 shadow-[0_0_15px_rgba(0,229,255,0.1)]' : 'text-gray-400 hover:text-gray-200 hover:bg-white/5 border border-transparent'}">Tengo</button>
                <button onclick="setFilter('missing')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-all ${filterMode === 'missing' ? 'bg-gradient-to-r from-cyan-500/20 to-purple-500/20 border border-cyan-400/30 text-cyan-300 shadow-[0_0_15px_rgba(0,229,255,0.1)]' : 'text-gray-400 hover:text-gray-200 hover:bg-white/5 border border-transparent'}">Faltan</button>
              </div>
              
              <!-- Botón Nueva Sección -->
              <button onclick="openModal('modal-section')" class="flex-1 sm:flex-none bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/40 text-purple-300 px-5 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all hover:shadow-[0_0_15px_rgba(168,85,247,0.3)] text-sm font-bold">
                <i class="ph ph-plus font-bold"></i> Nueva Sección
              </button>
            </div>
          </div>
      `;

      if (colSections.length === 0) {
        html += `
          <div class="text-center py-20 bg-[#101018]/50 border border-dashed border-white/10 rounded-3xl">
            <p class="text-gray-300 font-medium text-lg">Esta colección está vacía.</p>
            <p class="text-sm text-gray-500 mt-2">Crea una sección (ej. "Ediciones Limitadas") para clasificar los objetos.</p>
          </div>
        `;
      } else {
        html += `<div class="space-y-16">`;
        colSections.forEach(section => {
          const sectionItems = filteredItems.filter(i => i.sectionId === section.id);
          const totalSectionItems = items.filter(i => i.sectionId === section.id).length;
          
          if (sectionItems.length === 0 && filterMode !== 'all' && totalSectionItems > 0) return;

          html += `
            <div class="relative">
              <!-- Cabecera de Sección -->
              <div class="flex justify-between items-end mb-6 border-b border-white/5 pb-3">
                <div class="flex items-center gap-3">
                  <span class="w-1.5 h-8 bg-gradient-to-b from-cyan-400 to-purple-500 rounded-full shadow-[0_0_15px_rgba(0,229,255,0.5)]"></span>
                  <h3 class="text-2xl font-bold text-white tracking-wide">
                    ${esc(section.name)}
                    <span class="text-sm font-normal text-gray-500 ml-3 bg-white/5 px-2 py-0.5 rounded-full">Total: ${totalSectionItems}</span>
                  </h3>
                </div>
                
                <div class="flex gap-2">
                   <button onclick="promptDelete('section', '${section.id}', '${encodeURIComponent(section.name)}')" class="p-2 flex items-center gap-2 text-gray-500 hover:text-red-400 transition-colors bg-white/5 hover:bg-red-500/10 rounded-lg border border-transparent hover:border-red-500/30" title="Borrar Sección Global">
                    <i class="ph ph-trash"></i>
                  </button>
                  <button onclick="openAddItem('${section.id}')" class="px-3 py-2 flex items-center gap-1 text-cyan-400 hover:text-cyan-300 transition-colors bg-cyan-500/10 hover:bg-cyan-500/20 rounded-lg border border-cyan-500/20 hover:border-cyan-400/50 shadow-[0_0_10px_rgba(0,229,255,0.1)] font-medium text-sm">
                    <i class="ph ph-plus font-bold"></i> Añadir Objeto Global
                  </button>
                </div>
              </div>
          `;

          if (sectionItems.length === 0) {
            html += `
              <div class="text-center py-10 bg-white/5 border border-white/5 rounded-2xl text-gray-500 text-sm">
                No hay objetos que mostrar en esta vista.
              </div>
            `;
          } else {
            html += `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">`;
            sectionItems.forEach(item => {
              
              const isOwned = ownedItems.has(item.id);

              const isOwnedClasses = isOwned 
                ? 'bg-[#101525] border-cyan-400/60 shadow-[0_0_20px_rgba(0,229,255,0.2)] hover:shadow-[0_0_35px_rgba(0,229,255,0.4)] hover:-translate-y-2' 
                : 'bg-[#101018]/80 border-white/10 grayscale-[0.4] opacity-80 hover:grayscale-0 hover:opacity-100 hover:-translate-y-1';
              
              const imgContent = item.imageUrl 
                ? `<img src="${esc(item.imageUrl)}" alt="${esc(item.name)}" class="item-image w-full h-full object-contain p-2 object-center transition-transform duration-700 drop-shadow-[0_0_15px_rgba(255,255,255,0.1)]" loading="lazy" onerror="this.outerHTML='<div class=\\'w-full h-full flex items-center justify-center text-red-500\\'><i class=\\'ph ph-image-broken text-3xl\\'></i></div>'" />` 
                : `<div class="w-full h-full flex flex-col items-center justify-center relative">
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-900/40 via-transparent to-transparent opacity-50 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <i class="ph ph-image text-5xl text-cyan-500/50 drop-shadow-[0_0_15px_rgba(0,229,255,0.8)] item-image transition-transform duration-500"></i>
                    <div class="mt-4 w-12 h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-50"></div>
                   </div>`;
                   
              const checkIcon = isOwned 
                ? `<div class="w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-xl border transition-all duration-500 bg-cyan-400/20 border-cyan-400 text-cyan-400 shadow-[0_0_20px_rgba(0,229,255,0.6)] scale-110"><i class="ph-fill ph-check-circle text-xl drop-shadow-lg"></i></div>`
                : `<div class="w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-xl border transition-all duration-500 bg-black/60 border-gray-600 text-gray-400 group-hover:border-cyan-400/40 group-hover:text-cyan-400/40"><i class="ph ph-circle text-xl"></i></div>`;

              const gradientBg = isOwned ? 'from-[#050510]/95 via-[#050510]/60 to-transparent' : 'from-[#0a0a0f]/95 via-[#0a0a0f]/60 to-transparent';
              const textTitleCol = isOwned ? 'text-white drop-shadow-md' : 'text-gray-300';

              html += `
                <div onclick="toggleItem('${item.id}', ${isOwned})" class="item-card relative group rounded-2xl overflow-hidden cursor-pointer border backdrop-blur-sm aspect-[2/3] flex flex-col ${isOwnedClasses}">
                  <!-- Contenedor Imagen -->
                  <div class="flex-1 relative overflow-hidden flex items-center justify-center bg-gradient-to-b from-gray-900/50 to-black/80">
                    ${imgContent}
                    <div class="absolute inset-0 bg-gradient-to-t ${gradientBg} pointer-events-none"></div>
                  </div>
                  
                  <!-- Info -->
                  <div class="absolute bottom-0 w-full p-4 flex flex-col gap-1 z-10 pointer-events-none">
                    <h4 class="font-bold leading-tight line-clamp-2 ${textTitleCol}">${esc(item.name)}</h4>
                    ${item.description ? `<p class="text-[11px] text-gray-400 line-clamp-2 leading-tight">${esc(item.description)}</p>` : ''}
                  </div>

                  <!-- Check -->
                  <div class="absolute top-3 right-3 z-20 pointer-events-none">
                    ${checkIcon}
                  </div>

                  <!-- Botones de Acción Globales -->
                  <div class="absolute top-3 left-3 z-30 flex flex-col gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="event.stopPropagation(); promptEditItem('${item.id}', '${encodeURIComponent(item.name)}', '${encodeURIComponent(item.description || '')}', '${encodeURIComponent(item.imageUrl || '')}')" class="w-8 h-8 rounded-full bg-cyan-900/40 border border-cyan-500/50 text-cyan-400 flex items-center justify-center transition-all hover:bg-cyan-500 hover:text-white hover:scale-110 shadow-lg backdrop-blur-md" title="Editar Objeto Global">
                      <i class="ph ph-pencil-simple"></i>
                    </button>
                    <button onclick="event.stopPropagation(); promptDelete('item', '${item.id}', '${encodeURIComponent(item.name)}')" class="w-8 h-8 rounded-full bg-red-900/40 border border-red-500/50 text-red-400 flex items-center justify-center transition-all hover:bg-red-500 hover:text-white hover:scale-110 shadow-lg backdrop-blur-md" title="Eliminar Objeto Global">
                      <i class="ph ph-trash"></i>
                    </button>
                  </div>
                </div>
              `;
            });
            html += `</div>`;
          }
          html += `</div>`;
        });
        html += `</div>`;
      }
      
      html += `</div>`;
      return html;
    }


    // CONTROLADORES DE EVENTOS UI
    
    window.openCollection = (id) => {
      window.appState.activeCollectionId = id;
      window.appState.filterMode = 'all';
      renderApp();
    };

    window.closeCollection = () => {
      window.appState.activeCollectionId = null;
      renderApp();
    };

    window.setFilter = (mode) => {
      window.appState.filterMode = mode;
      renderApp();
    };

    window.openModal = (modalId) => {
      const el = document.getElementById(modalId);
      el.classList.remove('hidden-force');
      setTimeout(() => {
        const input = el.querySelector('input');
        if(input) input.focus();
      }, 50);
    };

    window.closeModal = (modalId) => {
      document.getElementById(modalId).classList.add('hidden-force');
      if (modalId === 'modal-collection') {
        document.getElementById('form-collection').reset();
        document.getElementById('modal-collection-title').innerText = 'Crear Colección';
        document.getElementById('btn-submit-collection').innerText = 'Generar Colección';
      }
      if (modalId === 'modal-section') document.getElementById('form-section').reset();
      if (modalId === 'modal-item') {
        document.getElementById('form-item').reset();
        document.getElementById('modal-item-title').innerText = 'Añadir Objeto';
        document.getElementById('btn-submit-item').innerText = 'Guardar Objeto';
        window.appState.targetSectionId = null;
      }
      if (modalId === 'modal-delete') window.appState.deleteTarget = null;
      window.appState.editTarget = null;
    };

    window.openAddItem = (sectionId) => {
      window.appState.targetSectionId = sectionId;
      window.openModal('modal-item');
    };

    window.promptEditCollection = (id, encName, encImg) => {
      const name = decodeURIComponent(encName);
      const img = decodeURIComponent(encImg);
      window.appState.editTarget = { type: 'collection', id };
      
      document.getElementById('modal-collection-title').innerText = 'Editar Colección';
      document.getElementById('btn-submit-collection').innerText = 'Guardar Cambios';
      document.getElementById('collection-name').value = name;
      document.getElementById('collection-url').value = img;
      
      window.openModal('modal-collection');
    };

    window.promptEditItem = (id, encName, encDesc, encImg) => {
      const name = decodeURIComponent(encName);
      const desc = decodeURIComponent(encDesc);
      const img = decodeURIComponent(encImg);
      window.appState.editTarget = { type: 'item', id };
      
      document.getElementById('modal-item-title').innerText = 'Editar Objeto';
      document.getElementById('btn-submit-item').innerText = 'Guardar Cambios';
      document.getElementById('item-name').value = name;
      document.getElementById('item-desc').value = desc;
      document.getElementById('item-url').value = img;
      
      window.openModal('modal-item');
    };

    window.promptDelete = (type, id, encName) => {
      const name = decodeURIComponent(encName);
      window.appState.deleteTarget = { type, id, name };
      
      let msgHTML = `<p>¿Estás seguro de que quieres eliminar <strong class="text-white font-bold">${esc(name)}</strong> de la <strong class="text-red-400">Base de Datos Global</strong>?</p>`;
      if (type === 'collection') msgHTML += `<p class="mt-2 text-red-400 bg-red-900/20 p-2 rounded border border-red-500/20">Se borrará para TODOS los usuarios, junto a sus secciones y objetos.</p>`;
      if (type === 'section') msgHTML += `<p class="mt-2 text-red-400 bg-red-900/20 p-2 rounded border border-red-500/20">Se borrará para TODOS los usuarios, junto a sus objetos.</p>`;
      if (type === 'item') msgHTML += `<p class="mt-2 text-red-400 bg-red-900/20 p-2 rounded border border-red-500/20">Se borrará para TODOS los usuarios.</p>`;
      
      document.getElementById('delete-message').innerHTML = msgHTML;
      window.openModal('modal-delete');
    };


    // LOGICA DE FIREBASE (Escrituras)

    // Crear Colección Pública
    document.getElementById('form-collection').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = window.appState.user;
      if (!user) return;
      const name = document.getElementById('collection-name').value.trim();
      const imageUrl = document.getElementById('collection-url').value.trim();
      if (!name) return;

      if (window.appState.editTarget?.type === 'collection') {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'collections', window.appState.editTarget.id);
        await updateDoc(docRef, { name, imageUrl });
      } else {
        const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'collections'));
        await setDoc(newRef, { name, imageUrl, createdBy: user.uid, createdAt: new Date().toISOString() });
      }
      window.closeModal('modal-collection');
    });

    // Crear Sección Pública
    document.getElementById('form-section').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = window.appState.user;
      const colId = window.appState.activeCollectionId;
      if (!user || !colId) return;
      
      const name = document.getElementById('section-name').value.trim();
      if (!name) return;

      const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'sections'));
      await setDoc(newRef, { name, collectionId: colId, createdBy: user.uid, createdAt: new Date().toISOString() });
      window.closeModal('modal-section');
    });

    // Crear Objeto Público
    document.getElementById('form-item').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = window.appState.user;
      
      const name = document.getElementById('item-name').value.trim();
      const desc = document.getElementById('item-desc').value.trim();
      const img = document.getElementById('item-url').value.trim();
      if (!name) return;

      if (window.appState.editTarget?.type === 'item') {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'items', window.appState.editTarget.id);
        await updateDoc(docRef, { name, description: desc, imageUrl: img });
      } else {
        const colId = window.appState.activeCollectionId;
        const secId = window.appState.targetSectionId;
        if (!user || !colId || !secId) return;

        const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'items'));
        await setDoc(newRef, {
          name, description: desc, imageUrl: img,
          sectionId: secId, collectionId: colId,
          createdBy: user.uid, createdAt: new Date().toISOString()
        });
      }
      window.closeModal('modal-item');
    });

    // Marcar Objeto Privado (Progreso personal)
    window.toggleItem = async (itemId, isCurrentlyOwned) => {
      const user = window.appState.user;
      if (!user) return;
      
      const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'owned_items', itemId);
      
      if (isCurrentlyOwned) {
        await deleteDoc(ref); // Ya no lo tengo
      } else {
        await setDoc(ref, { ownedAt: new Date().toISOString() }); // Ahora lo tengo
      }
    };

    // Confirmar Borrado Global
    window.confirmDelete = async () => {
      const user = window.appState.user;
      const target = window.appState.deleteTarget;
      if (!user || !target) return;

      try {
        if (target.type === 'item') {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', target.id));
        } 
        else if (target.type === 'section') {
          const itemsToDelete = window.appState.items.filter(i => i.sectionId === target.id);
          for (let itm of itemsToDelete) {
             await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', itm.id));
          }
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sections', target.id));
        } 
        else if (target.type === 'collection') {
          const itemsToDelete = window.appState.items.filter(i => i.collectionId === target.id);
          for (let itm of itemsToDelete) {
             await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', itm.id));
          }
          const secsToDelete = window.appState.sections.filter(s => s.collectionId === target.id);
          for (let sec of secsToDelete) {
             await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sections', sec.id));
          }
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'collections', target.id));
          window.appState.activeCollectionId = null;
        }
      } catch (err) {
        console.error("Error borrando:", err);
      }
      
      window.closeModal('modal-delete');
    };

    // Iniciar Aplicación al cargar
    window.onload = initApp;

  </script>
</body>
</html>
